<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="./assets/icons/hbo.png" type="image/x-icon">

    <link rel="stylesheet" href="../styles/singIn.css">
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/global.css">

    <title>HBO MAX LOGIN</title>
</head>
<body>
    <header>
        <a href="../../index.html"><img src="../assets/icons/hbo-logo.svg" width="160px" height="26px" alt="Hbo Logo"></a>
        <div class="login">
            <a href="../pages/singin.html">ENTRAR</a>
            <a href="#planos" class="button">ASSINE AGORA</a>
        </div>
    </header>
    <main class="login-content">
        <form class="login-login login-container">
            <h1 class="login-title">Entrar</h1>
            <label class="login-label"> Você tem uma conta da HBO Max? </label>
            <input
                class="login-field"
                type="email"
                name="email"
                id="email"
                placeholder="Endereço de e-mail"
            />
            <input
                class="login-field"
                type="password"
                name="password"
                id="password"
                placeholder="Senha"
                minlength="8"
            />
    
            <div class="login-actions">
                <button type="submit" class="button button--gradient">Entrar</button>
                <a href="#" class="login-link"> Esqueceu a senha? </a>
            </div>
        </form>
    </main>

    <footer>
        <div>
            <a class="footer" href="https://www.hbomax.com/br/pt/sitemap">
                Agora na HBO Max
            </a>
            <a class="footer" href="https://www.hbomax.com/br/pt/coming-soon">
                Em breve
            </a>
            <a class="footer" href="https://www.hbomax.com/br/pt/feature">
                Filme em destaque
            </a>
            <a class="footer" href="https://www.hbomax.com/br/pt/series"
                >Séries</a
            >
            <a class="footer" href="https://help.hbomax.com/br">Ajuda</a>
        </div>

        <p class="footer-legal">
            © 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos
            reservados. HBO Max é usado sob licença.
        </p>
        <div class="footer-social">
            <a href="https://www.facebook.com/HBOMaxBr/"class="footer-social">
                <img src="../assets/icons/fb_0.png" alt="Facebook" />
            </a>
            <a href="https://twitter.com/HBOMaxBR" class="footer-social">
                <img src="../assets/icons/twitter_0.png" alt="Twitter" />
            </a>
            <a href="https://www.instagram.com/hbomaxbr/" class="footer-social">
                <img src="../assets/icons/instagram_0.png" alt="Instagram" />
            </a>
            <a href="https://www.youtube.com/c/hbomaxbr" class="footer-social" >
                <img src="../assets/icons/youtube_0.png" alt="Youtube" />
            </a>
        </div>
    </footer>
    

</body>
</html>
